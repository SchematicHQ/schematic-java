// Gradle init script for the SDK E2E "pack" mode (see scripts/e2e-pack.sh).
//
// It does two things for a throwaway publishToMavenLocal:
//   - overrides the SDK version, so a dev machine's ~/.m2 never shadows a real
//     release with an E2E build;
//   - disables PGP signing, which needs release keys the E2E run does not have.
//
// This lives here rather than in build.gradle because build.gradle is
// regenerated by Fern -- it rewrites `version` on every release -- so it cannot
// be added to .fernignore. The real release path is untouched.

gradle.rootProject { root ->
    def packVersion = root.findProperty('schematicVersion')
    if (!packVersion) {
        return
    }

    root.afterEvaluate {
        root.version = packVersion
        root.publishing.publications.withType(MavenPublication).configureEach {
            it.version = packVersion
        }
        // Disabling (not excluding) the Sign tasks also drops the .asc files
        // from the publication, so publishToMavenLocal does not look for them.
        root.tasks.withType(org.gradle.plugins.signing.Sign).configureEach {
            it.enabled = false
        }
    }
}
