# Signs and uploads the Maven artifacts that `./gradlew publishToMavenLocal`
# stages in build/staging-deploy (see the publish job in .github/workflows/ci.yml).
#
# Publishing lives here rather than in build.gradle because Fern regenerates
# build.gradle; this file and ci.yml are in .fernignore.
#
# The version comes from JRELEASER_PROJECT_VERSION, set from the release tag.
project:
  name: schematic-java
  description: Official Java SDK for Schematic
  authors:
    - Schematic
  license: MIT
  links:
    homepage: https://schematichq.com
  languages:
    java:
      groupId: com.schematichq

signing:
  pgp:
    active: ALWAYS
    armored: true
    # Sign with the gpg binary on the runner; CI imports the key before this runs.
    mode: COMMAND

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - build/staging-deploy
