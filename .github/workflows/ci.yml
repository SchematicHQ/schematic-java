name: ci

on: [push]

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        id: setup-jre
        uses: actions/setup-java@v1
        with:
          java-version: "11"
          architecture: x64

      - name: Compile
        run: ./gradlew compileJava

      - name: Check formatting
        run: ./gradlew spotlessCheck

  test:
    needs: [ compile ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        id: setup-jre
        uses: actions/setup-java@v1
        with:
          java-version: "11"
          architecture: x64

      - name: Download WASM binary
        run: ./scripts/download-wasm.sh

      - name: Test
        run: ./gradlew test

  # Builds the artifacts with the Fern-generated build.gradle, then signs and
  # uploads them to Maven Central with JReleaser (config in jreleaser.yml).
  publish:
    needs: [ compile, test ]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        id: setup-jre
        uses: actions/setup-java@v1
        with:
          java-version: "11"
          architecture: x64

      - name: Download WASM binary
        run: ./scripts/download-wasm.sh

      - name: Stage artifacts
        run: |
          ./gradlew publishToMavenLocal -Dmaven.repo.local="$PWD/build/staging-deploy"
          # Gradle's local-repository index file isn't part of the release.
          find build/staging-deploy -name 'maven-metadata-local.xml' -delete

      - name: Resolve version
        id: version
        run: |
          VERSION=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from build.gradle"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "$VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match build.gradle version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing key
        run: echo "$MAVEN_SIGNATURE_SECRET_KEY" | gpg --batch --import
        env:
          MAVEN_SIGNATURE_SECRET_KEY: ${{ secrets.MAVEN_SIGNATURE_SECRET_KEY }}

      - name: Publish to Maven Central
        uses: jreleaser/release-action@v2
        with:
          version: 1.27.0
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_KEYNAME: ${{ secrets.MAVEN_SIGNATURE_KID }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_SIGNATURE_PASSWORD }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
