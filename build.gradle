plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '6.11.0'
}

repositories {
    mavenCentral()
    maven {
        url 'https://s01.oss.sonatype.org/content/repositories/releases/'
    }
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:5.2.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.6'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.6'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    implementation 'com.dylibso.chicory:runtime:1.4.0'
    implementation 'com.dylibso.chicory:wasi:1.4.0'
    implementation 'redis.clients:jedis:5.2.0'
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.3'
}


sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(Javadoc) {
    failOnError false
    options.addStringOption('Xdoclint:none', '-quiet')
}

spotless {
    java {
        palantirJavaFormat()
    }
}


java {
    withSourcesJar()
    withJavadocJar()
}


group = 'com.schematichq'

version = '1.6.10'

jar {
    dependsOn(":generatePomFileForMavenPublication")
    archiveBaseName = "schematic-java"
}

sourcesJar {
    archiveBaseName = "schematic-java"
}

javadocJar {
    archiveBaseName = "schematic-java"
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.schematichq'
            artifactId = 'schematic-java'
            version = '1.6.10'
            from components.java
            pom {
                name = 'Schematic'
                description = 'Official Java SDK for Schematic'
                url = 'https://schematichq.com'
                licenses {
                    license {
                        name = 'MIT'
                    }
                }
                developers {
                    developer {
                        name = 'Schematic'
                        email = 'support@schematichq.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/schematichq/schematic-java.git'
                    developerConnection = 'scm:git:git://github.com/schematichq/schematic-java.git'
                    url = 'https://github.com/schematichq/schematic-java'
                }
            }
        }
    }
    repositories {
        maven {
            url "$System.env.MAVEN_PUBLISH_REGISTRY_URL"
            credentials {
                username "$System.env.MAVEN_USERNAME"
                password "$System.env.MAVEN_PASSWORD"
            }
        }
    }
}

